
version: 2

snapshots:
  - name: dim_stores
    description: "Snapshot to track historical changes in the stores dimension table"
    relation: ref('eph_stores')
    config:
      schema: gold
      database: walmart
      unique_key: store_dimension_id
      strategy: timestamp
      updated_at: store_updated_timestamp
      dbt_valid_to : "to_date('9999-12-31')"
      