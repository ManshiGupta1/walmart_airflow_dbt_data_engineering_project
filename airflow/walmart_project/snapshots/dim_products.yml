
version: 2

snapshots:
  - name: dim_products
    description: "Snapshot to track historical changes in the products dimension table"
    relation: ref('eph_products')
    config:
      schema: gold
      database: walmart
      unique_key: product_dimension_id
      strategy: timestamp
      updated_at: product_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')"
