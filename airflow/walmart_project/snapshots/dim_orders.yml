
version: 2

snapshots:
  - name: dim_orders
    description: "Snapshot to track historical changes in the orders dimension table"
    relation: ref('eph_orders')
    config:
      schema: gold
      database: walmart
      unique_key: order_id
      strategy: timestamp
      updated_at: order_updated_timestamp
      dbt_valid_to : "to_date('9999-12-31')"
      