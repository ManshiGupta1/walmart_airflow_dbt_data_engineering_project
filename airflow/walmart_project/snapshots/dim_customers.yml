
version: 2

snapshots:
  - name: dim_customers
    description: "Snapshot to track historical changes in the customers dimension table"
    relation: ref('eph_customers')
    config:
      schema: gold
      database: walmart
      unique_key: customer_dimension_id
      strategy: timestamp
      updated_at: customer_updated_timestamp
      dbt_valid_to : "to_date('9999-12-31')"
      