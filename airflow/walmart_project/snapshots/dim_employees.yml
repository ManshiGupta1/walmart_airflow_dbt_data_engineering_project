
version: 2

snapshots:
  - name: dim_employees
    description: "Snapshot to track historical changes in the employees dimension table"
    relation: ref('eph_employees')
    config:
      schema: gold
      database: walmart
      unique_key: employee_id
      strategy: timestamp
      updated_at: employee_updated_timestamp
      dbt_valid_to : "to_date('9999-12-31')"
      